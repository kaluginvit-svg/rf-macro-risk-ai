name: Update Macro Report

on:
  schedule:
    # Every 3 days at 09:00 Moscow time (06:00 UTC)
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM provider (openai / gemini / anthropic / gigachat)'
        required: false
        default: 'openai'

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync

      - name: Run analysis agent
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIGACHAT_USER: ${{ secrets.GIGACHAT_USER }}
          GIGACHAT_PASSWORD: ${{ secrets.GIGACHAT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          MODEL_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          EXPORT_WEB_JSON: docs/data.json
        run: |
          uv run python src/lc_money_alert_bot.py \
            --provider "${{ github.event.inputs.provider || 'openai' }}"

      - name: Commit updated report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json runs_history.json || true
          git diff --staged --quiet || \
            git commit -m "chore: update macro report $(date -u '+%Y-%m-%d') [skip ci]"
          git push
